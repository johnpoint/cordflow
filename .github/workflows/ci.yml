name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests and generated contract
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
          pnpm types:check
          pnpm security:check

      - name: Frontend checks
        run: |
          pnpm check
          pnpm lint
          pnpm test

      - name: Native production build
        run: pnpm build:tauri

      - name: Browser end-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  package-deb:
    name: Package Debian
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Debian package
        run: pnpm build:deb

      - name: Inspect Debian package
        run: |
          deb_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          dpkg-deb --info "$deb_path"
          dpkg-deb --contents "$deb_path"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: cordflow-deb-amd64-${{ github.sha }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
