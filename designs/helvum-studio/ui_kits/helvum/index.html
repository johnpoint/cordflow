<!-- @startingPoint section="Product screens" subtitle="Output-first Studio Console with default-off expert controls" viewport="1320x860" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordflow Studio Console</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="../../_ds_bundle.js"></script>
    <style>
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      .console { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px 44px minmax(0, 1fr) 44px; width: 100%; height: 100%; }
      .topbar { grid-row: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 6px 18px; background: var(--hs-surface-sidebar); border-bottom: 1px solid var(--hs-border); }
      .brand { display: flex; align-items: center; gap: 10px; color: var(--hs-text-strong); }
      .brand > span:last-child { display: grid; align-content: center; gap: 2px; }
      .brand strong, .brand small { display: block; }
      .brand strong { line-height: 18px; }
      .brand small { color: var(--hs-text-muted); font-size: var(--hs-font-size-xs); line-height: 14px; }
      .brand-mark { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; min-height: 28px; padding: 0 6px; font-weight: var(--hs-weight-bold); letter-spacing: -.08em; border: 1px solid var(--hs-border); }
      .defaults { display: flex; justify-content: center; gap: 12px; }
      .top-actions { grid-column: 3; display: flex; align-self: stretch; align-items: center; gap: 10px; }
      .window-controls { display: flex; align-self: stretch; margin-right: -18px; border-left: 1px solid var(--hs-border); }
      .window-controls button { width: 34px; padding: 0; color: var(--hs-text-muted); font: var(--hs-font-size-xs) var(--hs-font-mono); background: transparent; border: 0; border-left: 1px solid var(--hs-border); border-radius: 0; cursor: pointer; }
      .window-controls button:first-child { border-left: 0; }
      .window-controls button:hover { color: var(--hs-text-strong); background: var(--hs-surface-hover); }
      .window-controls .window-controls__close:hover { color: var(--hs-danger); background: var(--hs-danger-soft); }
      .sidebar { grid-row: 2; display: flex; align-items: center; gap: 12px; padding: 4px 16px; background: var(--hs-surface-sidebar); border-bottom: 1px solid var(--hs-border); }
      .sidebar > small { display: none; }
      .sidebar > .hs-button, .sidebar > .patch-metrics { margin-left: auto; white-space: nowrap; }
      .statusbar { grid-row: 4; display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content max-content; align-items: center; gap: 12px; min-width: 0; padding: 4px 16px; background: var(--hs-surface-sidebar); border-top: 1px solid var(--hs-border); }
      .statusbar .defaults { justify-content: stretch; min-width: 0; }
      .statusbar .hs-device-selector { flex: 1 1 0; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
      .statusbar .hs-device-selector > span { flex: none; font-size: 10px; }
      .statusbar .hs-device-selector select { min-width: 0; min-height: 30px; font-size: var(--hs-font-size-xs); }
      .default-display { flex: 1 1 0; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
      .default-display span { flex: none; color: var(--hs-text-muted); font-size: 10px; }
      .default-display strong { overflow: hidden; min-width: 0; color: var(--hs-text-strong); font-size: var(--hs-font-size-xs); font-weight: var(--hs-weight-medium); text-overflow: ellipsis; }
      .workspace { grid-row: 3; min-width: 0; overflow: auto; padding: 20px 24px; background: var(--hs-surface-canvas); }
      .workspace--mixer { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); padding: 0; overflow: hidden; }
      .workspace--mixer .mixer-grid { position: relative; z-index: 1; padding: 20px 24px; overflow: auto; }
      .workspace-header { display: flex; align-items: end; gap: 20px; margin-bottom: 22px; }
      .workspace-header > div { flex: 1; }
      .eyebrow { color: var(--hs-text-strong); font-size: var(--hs-font-size-xs); font-weight: var(--hs-weight-bold); text-transform: uppercase; letter-spacing: .1em; }
      .eyebrow::before { content: '[+] '; }
      h1 { margin: 4px 0 2px; color: var(--hs-text-strong); font-size: var(--hs-font-size-display); }
      p { margin: 0; color: var(--hs-text-muted); }
      .stack { display: grid; gap: 12px; }
      .mixer-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .patch { display: grid; grid-template-columns: 1fr 310px; gap: 18px; min-height: 560px; }
      .patch-canvas { display: flex; align-items: start; gap: 80px; padding: 28px; background: var(--hs-surface-base); border: 1px solid var(--hs-border); border-radius: var(--hs-radius-md); overflow: auto; }
      .patch-column { display: grid; gap: 16px; }
      .patch-metrics, .hintbar__status, .hintbar__shortcuts, .hintbar__shortcuts > span { display: flex; align-items: center; }
      .patch-metrics { flex: none; gap: 0; overflow: hidden; border: 1px solid var(--hs-border); border-radius: 0; }
      .patch-metrics span { min-height: 30px; padding: 0 12px; border-right: 1px solid var(--hs-border); }
      .patch-metrics span:last-child { border-right: 0; }
      .hintbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; margin-bottom: 12px; padding: 0 16px; color: var(--hs-text); background: var(--hs-accent-soft); border-block: 1px solid var(--hs-accent); }
      .hintbar__status { gap: 8px; min-width: 0; }
      .hintbar__status span { overflow: hidden; color: var(--hs-text-muted); text-overflow: ellipsis; white-space: nowrap; }
      .hintbar__shortcuts { flex: none; gap: 12px; }
      .hintbar__shortcuts > span { gap: 4px; white-space: nowrap; }
      .hintbar kbd { padding: 2px 5px; background: var(--hs-surface-raised); border: 1px solid var(--hs-border-strong); border-bottom-width: 2px; border-radius: var(--hs-radius-sm); }
      @media (max-width: 960px) {
        .topbar { grid-template-columns: auto minmax(0, 1fr) auto; padding: 0 10px; gap: 10px; }
        .hs-workspace-nav__item small { display: none; }
        .statusbar { grid-template-columns: max-content minmax(0, 1fr) max-content max-content; gap: 8px; padding-inline: 8px; }
        .workspace { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {
        Button, ConnectionRow, DeviceSelector, Drawer, ModeSwitch, NodeCard, PortSocket,
        RouteLane, SpectrumAnalyzer, StatusBadge, VolumeControl, WorkspaceNav
      } = window.HelvumStudio_38c7d4;
      const studioNavItems = [
        { id: 'mixer', label: 'Output mixer', description: 'Volume, mute, and defaults', icon: '[=]' },
        { id: 'flows', label: 'Audio routing', description: 'Automatic stereo routing' },
        { id: 'patchbay', label: 'Advanced patchbay', description: 'Manual port routing', icon: '[:]' }
      ];
      const outputOptions = [{value:'built-in',label:'Built-in Audio · Current'}, {value:'usb',label:'Studio Monitor'}];
      const inputOptions = [{value:'mic',label:'Built-in Microphone · Current'}, {value:'usb-mic',label:'USB Microphone'}];
      function StudioConsole() {
        const [workspaceId, setWorkspaceId] = React.useState('mixer');
        const [advancedModeEnabled, setAdvancedModeEnabled] = React.useState(false);
        const [defaultDevicesEditing, setDefaultDevicesEditing] = React.useState(false);
        const [mainVolume, setMainVolume] = React.useState(82);
        const [studioVolume, setStudioVolume] = React.useState(118);
        const visibleStudioNavItems = advancedModeEnabled ? studioNavItems : studioNavItems.slice(0, 2);
        const changeAdvancedMode = (checked) => {
          setAdvancedModeEnabled(checked);
          if (!checked && workspaceId === 'patchbay') setWorkspaceId('mixer');
        };
        return (
          <main className="console" data-screen-label="Studio Console">
            <header className="topbar">
              <div className="brand"><span className="brand-mark">[CF]</span><span><strong>Cordflow</strong><small>PipeWire studio routing</small></span></div>
              <div className="top-actions"><Button variant="ghost">[..]</Button><div className="window-controls" aria-label="Window controls"><button type="button" aria-label="Minimize window">[-]</button><button type="button" aria-label="Maximize or restore window">[□]</button><button className="window-controls__close" type="button" aria-label="Close window">[x]</button></div></div>
            </header>
            <aside className="sidebar">
              <small>Workspaces</small>
              <WorkspaceNav items={visibleStudioNavItems} activeId={workspaceId} onChange={setWorkspaceId} />
              {workspaceId === 'patchbay' ? <div className="patch-metrics" aria-label="Graph summary"><span>6 nodes</span><span>14 ports</span><span>4 links</span></div> : null}
              {workspaceId === 'flows' ? <Button variant="primary">Create audio flow</Button> : null}
            </aside>
            <section className={`workspace ${workspaceId === 'mixer' ? 'workspace--mixer' : ''}`}>
              {workspaceId === 'flows' ? (
                <React.Fragment>
                  <div className="stack">
                    <RouteLane source="Firefox" stages={[{name:'EasyEffects',role:'Processor'}, {name:'Built-in Audio',role:'Output'}]} action={<Button variant="ghost">Edit</Button>} />
                    <RouteLane source="Music Player" stages={[{name:'Studio Monitor',role:'Output'}]} action={<Button variant="ghost">Edit</Button>} />
                    <RouteLane source="Built-in Microphone" stages={[{name:'Voice Filter',role:'Processor'}, {name:'Meeting App',role:'Destination'}]} action={<Button variant="ghost">Edit</Button>} />
                  </div>
                </React.Fragment>
              ) : workspaceId === 'mixer' ? (
                <React.Fragment>
                  <div className="mixer-grid"><VolumeControl name="Built-in Audio" detail="Default output" value={mainVolume} level={0.72} onChange={setMainVolume} /><VolumeControl name="Studio Monitor" detail="USB output" value={studioVolume} level={0.84} onChange={setStudioVolume} /></div>
                  <SpectrumAnalyzer device="Built-in Audio" leftBands={[0.04,0.08,0.18,0.42,0.68,0.51,0.32,0.2,0.14,0.22,0.38,0.55,0.44,0.3,0.26,0.4,0.58,0.46,0.31,0.2,0.15,0.11,0.18,0.24,0.16,0.1,0.08,0.05,0.04,0.03,0.02,0.01]} rightBands={[0.03,0.12,0.24,0.36,0.52,0.62,0.46,0.28,0.18,0.14,0.25,0.42,0.6,0.48,0.34,0.22,0.3,0.5,0.4,0.28,0.2,0.16,0.12,0.2,0.22,0.15,0.1,0.08,0.06,0.04,0.03,0.02]} />
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div className="hintbar"><div className="hintbar__status"><strong>Start:</strong><span>Firefox · output_FL · 3 compatible targets</span></div><div className="hintbar__shortcuts"><span><kbd>Tab</kbd> move</span><span><kbd>Enter</kbd> connect</span><span><kbd>Esc</kbd> cancel</span></div></div>
                  <div className="patch"><div className="patch-canvas">
                    <div className="patch-column"><NodeCard name="Firefox" detail="Audio source · Node 1"><PortSocket name="output_FL" id="11" selected={true} /><PortSocket name="output_FR" id="12" /></NodeCard><NodeCard name="MIDI Bridge" detail="MIDI · Node 8"><PortSocket name="events" id="81" media="midi" /></NodeCard></div>
                    <div className="patch-column"><NodeCard name="EasyEffects" detail="Duplex processor · Node 2"><PortSocket name="input_FL" id="21" direction="input" /><PortSocket name="input_FR" id="22" direction="input" /></NodeCard></div>
                  </div><Drawer title="Connections"><div className="stack"><ConnectionRow from="Firefox · output_FL" to="EasyEffects · input_FL" selected={true} action={<Button variant="danger">Disconnect</Button>} /><ConnectionRow from="Firefox · output_FR" to="EasyEffects · input_FR" /></div></Drawer></div>
                </React.Fragment>
              )}
            </section>
            <footer className="statusbar">
              <StatusBadge tone="success">Connected</StatusBadge>
              <div className="defaults">
                {defaultDevicesEditing ? (
                  <React.Fragment>
                    <DeviceSelector label="Default input" value="mic" options={inputOptions} />
                    <DeviceSelector label="Default output" value="built-in" options={outputOptions} />
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div className="default-display"><span>Default input</span><strong>Built-in Microphone</strong></div>
                    <div className="default-display"><span>Default output</span><strong>Built-in Audio</strong></div>
                  </React.Fragment>
                )}
              </div>
              <Button variant="ghost" onClick={() => setDefaultDevicesEditing(!defaultDevicesEditing)}>{defaultDevicesEditing ? 'Done' : 'Edit'}</Button>
              <ModeSwitch label="Advanced mode" checked={advancedModeEnabled} onChange={changeAdvancedMode} />
            </footer>
          </main>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<StudioConsole />);
    </script>
  </body>
</html>
