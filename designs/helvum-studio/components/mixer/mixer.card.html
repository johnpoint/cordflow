<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="../../_ds_bundle.js"></script>
    <style>
      body {
        padding: 18px;
      }
      #root {
        position: relative;
        min-height: 424px;
      }
      .specimen-controls {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { SpectrumAnalyzer, VolumeControl } = window.HelvumStudio_38c7d4;
      function MixerSpecimen() {
        const [leftVolume, setLeftVolume] = React.useState(82);
        const [rightVolume, setRightVolume] = React.useState(118);
        const [spectrumPhase, setSpectrumPhase] = React.useState(0);
        React.useEffect(() => {
          const spectrumTimer = window.setInterval(() => {
            setSpectrumPhase((phaseValue) => phaseValue + 0.12);
          }, 80);
          return () => window.clearInterval(spectrumTimer);
        }, []);
        const spectrumBands = (channelPhase) =>
          Array.from({ length: 32 }, (_, bandIndex) => {
            const bass = Math.exp(
              -Math.pow((bandIndex - 7 - Math.sin(spectrumPhase + channelPhase) * 2) / 4.5, 2),
            );
            const presence = Math.exp(
              -Math.pow((bandIndex - 19 - Math.cos(spectrumPhase * 0.7 + channelPhase) * 3) / 6, 2),
            );
            const movement =
              0.5 +
              0.5 *
                Math.abs(
                  Math.sin(
                    spectrumPhase * (1.1 + bandIndex * 0.035) + bandIndex + channelPhase * 2.4,
                  ),
                );
            return Math.min(1, (bass * 0.68 + presence * 0.48 + 0.025) * movement);
          });
        return (
          <React.Fragment>
            <div className="specimen-controls">
              <VolumeControl
                name="Built-in Audio"
                detail="Default output"
                value={leftVolume}
                level={0.72}
                onChange={setLeftVolume}
              />
              <VolumeControl
                name="Studio Monitor"
                detail="USB output"
                value={rightVolume}
                level={0.84}
                onChange={setRightVolume}
              />
            </div>
            <SpectrumAnalyzer
              device="Built-in Audio"
              leftBands={spectrumBands(0)}
              rightBands={spectrumBands(0.64)}
            />
          </React.Fragment>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<MixerSpecimen />);
    </script>
  </body>
</html>
