<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="128"
  height="128"
  viewBox="0 0 128 128"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Cordflow</title>

  <!-- Chamfered studio badge: crisp at small system-tray sizes. -->
  <path
    d="M20 7h88l13 13v88l-13 13H20L7 108V20Z"
    fill="#101318"
    stroke="#69727f"
    stroke-width="2"
  />

  <!-- The two halves form a C while keeping left/right audio channels distinct. -->
  <path
    d="M94 35H59C42.98 35 30 47.98 30 64"
    fill="none"
    stroke="#65b5ff"
    stroke-linecap="square"
    stroke-linejoin="round"
    stroke-width="11"
  />
  <path
    d="M30 64c0 16.02 12.98 29 29 29h35"
    fill="none"
    stroke="#087cff"
    stroke-linecap="square"
    stroke-linejoin="round"
    stroke-width="11"
  />

  <!-- A routed signal leaves the open side of the C. -->
  <path d="M57 64h43" fill="none" stroke="#eaf4ff" stroke-linecap="square" stroke-width="7" />

  <!-- Square sockets echo Cordflow's patchbay without reusing Helvum artwork. -->
  <path d="M91 29h12v12H91Z" fill="#101318" stroke="#65b5ff" stroke-width="4" />
  <path d="M91 87h12v12H91Z" fill="#101318" stroke="#087cff" stroke-width="4" />
  <path d="M98 58h12v12H98Z" fill="#101318" stroke="#eaf4ff" stroke-width="4" />
</svg>
